<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9f3ee">
  <meta name="description" content="一个安静、简单的起身喝水提醒工具。">
  <title>起身喝水提醒</title>
  <link rel="stylesheet" href="../common-utils/theme.css">
  <link rel="stylesheet" href="main.css">
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">TAKE A GENTLE BREAK</p>
        <h1>起来走走，喝口水</h1>
        <p class="intro">让短暂的停顿，照顾久坐中的自己。</p>
      </div>
      <div class="status-pill" id="runningStatus" data-state="stopped">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="runningStatusText">尚未开始</span>
      </div>
    </header>

    <section class="timer-card" aria-labelledby="timerTitle">
      <div class="timer-heading">
        <p id="timerTitle">距离下一次休息</p>
        <p class="next-time" id="nextTime">设置好间隔后开始吧</p>
      </div>

      <div class="countdown" id="countdown" aria-live="polite" aria-atomic="true">
        <span id="minuteText">45</span><span class="colon">:</span><span id="secondText">00</span>
      </div>

      <div class="primary-actions">
        <button class="button button-primary" id="startButton" type="button">开始提醒</button>
        <button class="button button-secondary" id="resetButton" type="button">重新计时</button>
      </div>
    </section>

    <section class="settings-grid" aria-label="提醒设置">
      <article class="panel interval-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-label">提醒间隔</p>
            <p class="panel-help">修改后会从现在重新计时</p>
          </div>
          <label class="interval-input">
            <span class="sr-only">提醒间隔，单位分钟</span>
            <input id="intervalInput" type="number" min="1" max="240" step="1" value="45" inputmode="numeric">
            <span>分钟</span>
          </label>
        </div>
        <div class="quick-options" aria-label="快捷间隔">
          <button class="quick-button" type="button" data-minutes="1" aria-label="1 分钟">1</button>
          <button class="quick-button" type="button" data-minutes="10" aria-label="10 分钟">10</button>
          <button class="quick-button" type="button" data-minutes="30" aria-label="30 分钟">30</button>
          <button class="quick-button is-active" type="button" data-minutes="45" aria-label="45 分钟">45</button>
          <button class="quick-button" type="button" data-minutes="60" aria-label="60 分钟">60</button>
        </div>
      </article>

      <article class="panel preferences-panel">
        <div class="preference-row">
          <div>
            <p class="panel-label">提示音</p>
            <p class="panel-help">持续播放轻柔铃声，确认后停止</p>
          </div>
          <label class="switch">
            <input id="soundToggle" type="checkbox" checked>
            <span class="switch-track" aria-hidden="true"></span>
            <span class="sr-only">开启提示音</span>
          </label>
        </div>
        <div class="preference-row notification-row">
          <div>
            <p class="panel-label">桌面通知</p>
            <p class="panel-help" id="notificationStatus">点击开始后申请通知权限</p>
          </div>
          <button class="text-button" id="testButton" type="button">测试提醒</button>
        </div>
      </article>
    </section>

    <footer class="app-footer">
      <a class="back-link" href="/use/">
        <span class="back-link-arrow" aria-hidden="true">←</span>
        <span>返回工具列表</span>
      </a>
      <div class="summary app-footer-content">
        <p>今天已经温柔地提醒了你 <strong id="todayCount">0</strong> 次</p>
        <p class="summary-note">保持此页面打开即可在后台运行</p>
      </div>
    </footer>
  </main>

  <dialog class="reminder-dialog" id="reminderDialog">
    <div class="dialog-icon" aria-hidden="true">☕</div>
    <p class="eyebrow dialog-eyebrow">休息时间到</p>
    <h2 id="dialogTitle">起来走一走吧</h2>
    <p id="dialogMessage">喝口水，看看远处，让眼睛和身体都松一松。</p>
    <div class="dialog-actions">
      <button class="button button-primary" id="doneButton" type="button">好，我去走走</button>
      <button class="button button-secondary" id="snoozeButton" type="button">5 分钟后再提醒</button>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>

</html>
