<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9f3ee">
    <title>Bilibili Header</title>
    <link rel="stylesheet" href="../../common-utils/theme.css">
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 0;
            overflow: hidden;
        }

        .bili-header__banner {
            position: relative;
            z-index: 1;
            width: 100%;
            margin: 0 auto;
            min-width: 1000px;
            min-height: 155px;
            height: 9.375vw;
            max-height: 240px;
            overflow: hidden;
            isolation: isolate;
            contain: layout paint;
            background-color: #e3e5e7;
            box-shadow: var(--shadow);
        }

        .animated-banner {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 400ms ease;
        }

        .animated-banner.is-ready {
            opacity: 1;
        }

        .animated-banner>.layer {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .animated-banner>.layer>img,
        .animated-banner>.layer>video {
            display: block;
            max-width: none;
            flex: none;
            transform-origin: center center;
            will-change: transform, filter, opacity;
            user-select: none;
        }

        .animated-banner>.layer>video {
            object-fit: contain;
        }

        .banner-status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #61666d;
            font: 14px/1.5 system-ui, sans-serif;
        }

        .banner-status[hidden] {
            display: none;
        }

        @media (max-width: 1099.9px) {
            .bili-header .bili-header__banner .header-banner__inner {
                padding: 0 56px
            }
        }

        @media (min-width: 1100px) and (max-width: 1366.9px) {
            .bili-header .bili-header__banner .header-banner__inner {
                padding: 0 56px
            }
        }

        @media (min-width: 1367px) and (max-width: 1700.9px) {
            .bili-header .bili-header__banner .header-banner__inner {
                padding: 0 64px
            }
        }

        @media (min-width: 1701px) and (max-width: 2199.9px) {
            .bili-header .bili-header__banner .header-banner__inner {
                padding: 0 96px;
                max-width: 2270px
            }
        }

        @media (min-width: 2200px) {
            .bili-header .bili-header__banner .header-banner__inner {
                max-width: 2078px
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .animated-banner {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="bili-header__banner" id="outter" aria-label="Bilibili animated header">
        <div class="banner-status">正在加载 banner…</div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
