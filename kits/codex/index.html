<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Session Viewer</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="shortcut icon" href="/images/favicon-32x32-next.jpg" type="image/x-icon">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CODEX SESSION VIEWER</p>
        <h1>Codex 会话可视化</h1>
      </div>
      <div class="source-actions">
        <select id="sampleSelect" class="control-select" aria-label="选择示例文件"></select>
        <button id="reloadBtn" class="icon-button" type="button" title="重新加载示例">↻</button>
        <label class="upload-button" title="上传 JSONL session">
          <input id="fileInput" type="file" accept=".jsonl,.json,application/json,application/jsonl">
          上传
        </label>
      </div>
    </header>

    <section class="summary-grid" aria-label="会话概览">
      <article class="metric">
        <span class="metric-label">消息</span>
        <strong id="messageCount">0</strong>
      </article>
      <article class="metric">
        <span class="metric-label">工具调用</span>
        <strong id="toolCount">0</strong>
      </article>
      <article class="metric">
        <span class="metric-label">命令</span>
        <strong id="commandCount">0</strong>
      </article>
      <article class="metric">
        <span class="metric-label">时长</span>
        <strong id="durationText">-</strong>
      </article>
    </section>

    <section class="workspace">
      <aside class="sidebar">
        <section class="panel">
          <h2>Session</h2>
          <dl id="sessionMeta" class="meta-list"></dl>
          <p id="statusText" class="status-text">正在加载...</p>
        </section>

        <section class="panel">
          <h2>筛选</h2>
          <label class="field">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="内容、命令、路径">
          </label>
          <label class="field">
            <span>类型</span>
            <select id="typeFilter">
              <option value="all">全部事件</option>
              <option value="message">聊天消息</option>
              <option value="tool">工具调用</option>
              <option value="command">命令执行</option>
              <option value="system">系统事件</option>
            </select>
          </label>
          <label class="field">
            <span>角色</span>
            <select id="roleFilter">
              <option value="all">全部角色</option>
              <option value="user">User</option>
              <option value="assistant">Assistant</option>
              <option value="tool">Tool</option>
              <option value="system">System</option>
            </select>
          </label>
          <label class="check-row">
            <input id="compactToggle" type="checkbox" checked>
            <span>紧凑显示工具输出</span>
          </label>
        </section>
      </aside>

      <section class="timeline-wrap">
        <div class="timeline-head">
          <h2>时间线</h2>
          <span id="visibleCount" class="visible-count">0 / 0</span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>
    </section>
  </main>

  <script src="js/codex-session.js"></script>
  <script src="main.js"></script>
</body>
</html>
