<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9f3ee">
  <meta name="description" content="从一个日期算到今天，查看已经过去的总天数、完整月份和年月日。">
  <title>已经过去多久</title>
  <link rel="stylesheet" href="../common-utils/theme.css">
  <link rel="stylesheet" href="main.css">
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell elapsed-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">TIME SINCE</p>
        <h1>已经过去多久</h1>
        <p class="intro">选一个开始日期，算算它与今天之间的距离。</p>
      </div>
    </header>

    <section class="calculator panel" aria-labelledby="calculator-title">
      <h2 id="calculator-title" class="sr-only">日期计算器</h2>
      <form id="date-form" novalidate>
        <div class="date-field">
          <label for="start-date">从这一天开始</label>
          <span class="date-control">
            <input id="start-date" name="from" type="text" placeholder="YYYY-MM-DD" autocomplete="off"
              aria-describedby="date-format-hint" required>
            <button id="date-picker-trigger" class="date-picker-trigger" type="button" aria-label="打开日历选择日期">
              <span class="calendar-icon" aria-hidden="true"></span>
            </button>
            <input id="date-picker" class="date-picker" type="date" aria-label="使用日历选择日期" tabindex="-1">
          </span>
        </div>
        <button class="button button-primary calculate-button" type="submit">开始计算</button>
      </form>
      <p class="form-hint"><span id="date-format-hint">格式：YYYY-MM-DD，也支持“/”或“.”</span><span id="today-label"></span></p>
      <p class="error-message" id="error-message" role="alert" hidden></p>
      <div class="preset-section" aria-label="常用日期">
        <p class="preset-label">常用日期</p>
        <div class="preset-list">
          <button class="preset-button" type="button" data-date="1998-12-04">
            <span>1998 · 12 · 04</span>
            <span class="preset-state">选择</span>
          </button>
          <button class="preset-button" type="button" data-date="2022-07-01">
            <span>2022 · 07 · 01</span>
            <span class="preset-state">选择</span>
          </button>
        </div>
      </div>
    </section>

    <section class="empty-state" id="empty-state">
      <div class="empty-orbit" aria-hidden="true">
        <span></span>
      </div>
      <p>时间会把答案写在这里</p>
    </section>

    <section class="results" id="results" aria-live="polite" hidden>
      <div class="result-lead">
        <p class="result-kicker">一共过去了</p>
        <p class="day-total"><strong id="total-days">0</strong><span>天</span></p>
        <p class="date-range" id="date-range"></p>
      </div>

      <div class="answer-grid">
        <article class="answer-card accent-card">
          <p class="answer-label">实际经过月份</p>
          <p class="answer-value"><strong id="calendar-months">0</strong><span>个月</span></p>
          <p class="answer-note" id="month-remainder">再加 0 天</p>
        </article>

        <article class="answer-card">
          <p class="answer-label">日历时间</p>
          <p class="answer-value answer-value-words" id="calendar-duration">0 年 0 个月 0 天</p>
          <p class="answer-note">按日历逐月计算</p>
        </article>

        <article class="answer-card">
          <p class="answer-label">按周来看</p>
          <p class="answer-value answer-value-words" id="week-duration">0 周 0 天</p>
          <p class="answer-note">每 7 天为一周</p>
        </article>
      </div>

    </section>

    <footer class="app-footer">
      <a class="back-link" href="/use/">
        <span class="back-link-arrow" aria-hidden="true">←</span>
        <span>返回工具列表</span>
      </a>
      <p class="calculation-note app-footer-content">月份按日历逐月计算；起始日不计入，起始日期与今天都按你所在地的凌晨 0 点计算。</p>
    </footer>
  </main>

  <script src="main.js"></script>
</body>

</html>
