<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9f3ee">
  <meta name="description" content="集中查看重要日期以及距离到期还剩多久。">
  <title>事件倒计时</title>
  <link rel="stylesheet" href="../common-utils/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">

</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell countdown-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">COUNTDOWN BOARD</p>
        <h1>事件倒计时</h1>
        <p class="intro">按最近到期时间自动排序，清晰查看每个重要节点。</p>
      </div>
    </header>

    <section class="controls panel">
      <label class="toggle switch" for="showExpired">
        <input id="showExpired" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
        <span class="toggle-text">显示过期事件</span>
      </label>
      <p class="now" id="nowText"></p>
    </section>

    <section id="eventList" class="event-list"></section>

    <footer class="app-footer">
      <a class="back-link" href="/use/">
        <span class="back-link-arrow" aria-hidden="true">←</span>
        <span>返回工具列表</span>
      </a>
      <p id="statusText" class="status app-footer-content"></p>
    </footer>
  </main>

  <script src="js/date-parser.js"></script>
  <script src="js/countdown.js"></script>
  <script src="main.js"></script>
</body>

</html>
