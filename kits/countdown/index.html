<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件倒计时</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="shortcut icon" href="/images/favicon-32x32-next.jpg" type="image/x-icon">

</head>
<body>
  <div class="bg-shape bg-shape-a"></div>
  <div class="bg-shape bg-shape-b"></div>

  <main class="page">
    <header class="hero">
      <p class="eyebrow">COUNTDOWN BOARD</p>
      <h1>事件倒计时</h1>
      <!-- <p class="sub">按最近到期时间自动排序，清晰查看每个重要节点。</p> -->
    </header>

    <section class="controls">
      <label class="toggle" for="showExpired">
        <input id="showExpired" type="checkbox">
        <span class="toggle-ui"></span>
        <span class="toggle-text">显示过期事件</span>
      </label>
      <p class="now" id="nowText"></p>
    </section>

    <section id="eventList" class="event-list"></section>
    <p id="statusText" class="status"></p>
  </main>

  <script src="js/date-parser.js"></script>
  <script src="js/countdown.js"></script>
  <script src="main.js"></script>
</body>
</html>
