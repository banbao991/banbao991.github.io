<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
    <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131a">
    <title>MajSoul · Spine 2D Animation</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <main class="app-shell">
        <header class="titlebar">
            <div>
                <p class="eyebrow">MAJSOUL · SPINE 3.8</p>
                <h1>2D 动画（仅供学习）</h1>
            </div>
            <div class="runtime-status" id="runtimeStatus" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="statusText">正在初始化</span>
            </div>
        </header>

        <section class="stage" aria-label="2D 动画舞台">
            <canvas id="canvas" tabindex="0" aria-label="角色动画画面，点击可播放互动动作">
                当前浏览器不支持 Canvas，请升级浏览器后重试。
            </canvas>

            <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite">
                <span class="loader" aria-hidden="true"></span>
                <strong>正在组装 2D 动画</strong>
                <span id="loadingDetail">加载骨骼、图集与纹理…</span>
            </div>

            <div class="error-overlay" id="errorOverlay" role="alert" hidden>
                <strong>动画加载失败</strong>
                <span id="errorMessage">请检查浏览器控制台。</span>
                <button type="button" id="reloadButton">重新加载</button>
            </div>

            <p class="stage-hint" id="stageHint" hidden>点击画面触发互动</p>
        </section>

        <nav class="controls" aria-label="动画控制">
            <button type="button" data-animation="greeting" disabled>
                <span class="control-key">1</span>
                <span>问候</span>
            </button>
            <button type="button" data-animation="click" disabled>
                <span class="control-key">2</span>
                <span>互动</span>
            </button>
            <button type="button" data-animation="celebrate" disabled>
                <span class="control-key">3</span>
                <span>庆祝</span>
            </button>
            <button type="button" data-animation="idle" disabled>
                <span class="control-key">4</span>
                <span>待机</span>
            </button>
            <button type="button" class="pause-control" id="togglePlayback" disabled>
                <span class="pause-icon" aria-hidden="true">Ⅱ</span>
                <span id="playbackLabel">暂停</span>
            </button>
        </nav>

        <footer>
            <span id="animationLabel">准备资源</span>
            <span>WebGL · 489 bones · 197 attachments</span>
        </footer>
    </main>

    <noscript>此页面需要启用 JavaScript 才能播放动画。</noscript>
    <script src="/libs/spine-3.8/spine-webgl.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
