<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4ef">
  <meta name="description" content="本地 Markdown 阅读器：通过 ?file=站点根目录相对路径 阅读 Markdown 文件。">
  <title>Markdown 阅读器</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="../../libs/markdown/marked.umd.js" defer></script>
  <script src="../../libs/markdown/purify.min.js" defer></script>
  <script src="main.js?v=3" defer></script>
</head>
<body id="top">
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Markdown 阅读器首页"><span class="brand-icon">M<span>↗</span></span><span><strong>MARKDOWN</strong><small>阅读器 / READER</small></span></a>
      <form id="open-form" class="open-form" autocomplete="off">
        <label for="file-input">文件路径 <span>ROOT /</span></label>
        <div class="input-wrap"><input id="file-input" name="file" type="text" placeholder="kits/farm/doc/世界与玩法.md" spellcheck="false" aria-describedby="path-hint" required><button type="submit">打开文档 <span>↗</span></button></div>
      </form>
      <div class="header-actions"><button id="copy-link" type="button" title="复制当前阅读链接">复制链接</button><button id="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">☾</button></div>
    </header>

    <main>
      <div class="document-header">
        <div class="document-header-inner">
          <div class="eyebrow"><span class="dot"></span> DOCUMENT VIEWER <span class="slash">/</span> 清晰阅读每一行</div>
          <h1 id="document-title">正在打开文档…</h1>
          <div class="document-meta"><span id="document-path">—</span><span class="meta-separator">·</span><span id="document-info">Markdown</span><a id="raw-link" href="#" target="_blank" rel="noopener noreferrer">查看原文件 ↗</a></div>
        </div>
      </div>

      <div class="reading-layout">
        <aside class="toc-panel" aria-label="文档目录"><div class="toc-head"><span>本页目录</span><span>CONTENTS</span></div><nav id="toc" aria-label="文档标题"></nav><div class="toc-tip">选择标题快速跳转<br>按 <kbd>/</kbd> 可切换文件</div></aside>
        <div class="reading-main"><p id="path-hint" class="hint">路径从站点根目录开始，例如 <code>kits/farm/doc/世界与玩法.md</code>。</p><div id="message" class="message" role="status" aria-live="polite"></div><article id="content" class="markdown-body" aria-label="Markdown 文档"></article><footer class="reader-footer"><span>END OF DOCUMENT <b>✳</b></span><a href="#top" id="back-top">回到顶部 ↑</a></footer></div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
