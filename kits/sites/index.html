<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Banbao 收藏的学习网站与朋友们的博客。">
  <meta name="theme-color" content="#e9f3ee">
  <title>链接 · Banbao</title>
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">
  <link href="/mylibs/directory-page/main.css" rel="stylesheet" type="text/css">
  <link href="main.css" rel="stylesheet" type="text/css">
  <script src="/mylibs/directory-page/main.js" defer></script>
  <script src="main.js" defer></script>
</head>

<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="page-shell">
    <header class="hero">
      <nav class="topbar" aria-label="页面导航">
        <a class="brand" href="/" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>BANBAO</span>
        </a>
        <span class="page-label">LINKS / 友链</span>
      </nav>

      <div class="hero-content">
        <h1>海内存知己，天涯若比邻。</h1>
      </div>

      <div class="toolbar">
        <label class="search" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜索链接" aria-label="搜索链接" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <p class="result-count" aria-live="polite"><span id="visible-count">—</span> 个去处</p>
      </div>
    </header>

    <main class="directory" id="directory" aria-busy="true"></main>

    <div class="empty-state" id="empty-state" hidden>
      <span aria-hidden="true">⌁</span>
      <p>没有找到匹配的链接</p>
      <button id="clear-search" type="button">清除搜索</button>
    </div>

    <footer>
      <p>在网络里，偶尔串门。</p>
      <a href="#" id="back-to-top">回到顶部 ↑</a>
    </footer>
  </div>
</body>

</html>
