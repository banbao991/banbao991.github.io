<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Banbao 的工具。">
  <meta name="theme-color" content="#f3f1eb">
  <title>工具 · Banbao</title>
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/images/favicon-32x32-next.jpg">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="/images/favicon-16x16-next.jpg">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-next.jpg">

  <link href="/mylibs/directory-page/main.css" rel="stylesheet" type="text/css">
  <link href="main.css" rel="stylesheet" type="text/css">
  <script src="/libs/d3.v6.min.js"></script>
  <script src="/mylibs/directory-page/main.js" defer></script>
  <script src="main.js" defer></script>
</head>

<body>
  <div class="page-shell">
    <header class="hero">
      <nav class="topbar" aria-label="页面导航">
        <a class="brand" href="/" aria-label="返回首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>BANBAO</span>
        </a>
        <span class="page-label">USE / 工具</span>
      </nav>

      <div class="hero-content">
        <h1>
          <button class="hero-title-toggle" id="hidden-toggle" type="button" aria-expanded="false">
            采菊东篱下，悠然见南山。
          </button>
        </h1>
      </div>

      <div class="toolbar">
        <label class="search" for="search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input id="search-input" type="search" placeholder="搜索作品" aria-label="搜索作品" autocomplete="off">
          <kbd aria-hidden="true">/</kbd>
        </label>
        <p class="result-count" aria-live="polite"><span id="visible-count">—</span> 个项目</p>
      </div>
    </header>

    <main class="collection" id="collection">
      <div class="grid" id="grid" aria-busy="true"></div>
      <div class="empty-state" id="empty-state" hidden>
        <span aria-hidden="true">⌁</span>
        <p>没有找到匹配的项目</p>
        <button id="clear-search" type="button">清除搜索</button>
      </div>
    </main>

    <footer>
      <p>在需要时，恰好趁手。</p>
      <a href="#" id="back-to-top">回到顶部 ↑</a>
    </footer>
  </div>
</body>

</html>
